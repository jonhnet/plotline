<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pattern Studio — Plotline</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/inksets.css"><link rel="stylesheet" href="/patterns/style.css"><script type="module" src="/patterns/app.js"></script></head>
<body class="studio" data-studio="patterns">
<header class="masthead">
 <a class="brand" href="/">Pattern Studio <small>Plotline</small></a>
 <nav class="document-bar" aria-label="Pattern documents"><div id="document-tabs" role="tablist" aria-label="Open documents"></div><button id="new-document" aria-label="New pattern" title="New pattern">+</button></nav>
 <div class="header-actions"><button id="open-library">Open…</button><button id="revert" disabled>Revert</button><button id="save" class="primary">Save</button><button id="save-copy">Save As…</button></div>
</header>
<main class="studio-shell">
 <aside class="controls" aria-label="Pattern controls">
  <fieldset><legend>Pattern</legend><label>Family<select id="family"></select></label><div class="control-actions"><button id="browse">Browse families…</button><button id="reset-preset">Reset knobs</button></div><div id="knobs"></div><div id="complex-context" hidden><div id="julia-parameter" hidden><label>Julia c · real<input id="julia-real" type="number" step="any" min="-100" max="100"></label><label>Julia c · imaginary<input id="julia-imag" type="number" step="any" min="-100" max="100"></label><button id="julia-preset" hidden>Use Julia preset</button></div><p id="plane-instruction" class="quiet"></p><p id="plane-coordinates" class="quiet"></p></div><p id="family-note" class="quiet" hidden></p></fieldset>
  <fieldset><legend>Composition</legend><div id="composition-knobs"></div></fieldset>
  <fieldset><legend>Paper</legend><label>Sheet<select id="paper"></select></label><label>Orientation<select id="orientation"><option value="0">Landscape · 0°</option><option value="90">Portrait · 90°</option><option value="180">Landscape · 180°</option><option value="270">Portrait · 270°</option></select></label><label>Margins<select id="margins"><option value="plotter">From plotter</option><option value="custom">Custom</option></select></label><div id="custom-margins" hidden><label>All edges · <span data-paper-unit>in</span><input id="margin" data-paper-length type="number" min="0" value="15"></label></div></fieldset>
  <fieldset><legend>Inks</legend><button id="edit-inks">Pattern inks…</button><div id="ink-summary"></div><p id="ink-warning" class="quiet"></p></fieldset>
 </aside>
 <section class="workspace" aria-label="Pattern preview">
  <div class="preview-area"><canvas id="preview" tabindex="0" aria-label="Pattern on paper; scroll to zoom, drag to pan"></canvas><div id="preview-tools"><div id="complex-tools" hidden><button id="explore-plane" aria-pressed="false">Explore</button><button id="pick-julia" aria-pressed="false">Pick Julia</button><button id="reset-plane">Reset view</button></div><label><input type="checkbox" id="show-margins">Margins</label></div></div>
  <div id="work-status" aria-live="polite"><progress id="work-progress" value="0" max="100"></progress><div class="progress-line"><span id="work-detail">Loading patterns…</span><span id="progress-time"></span><button id="refine-preview" hidden>Refine detail</button><button id="cancel-preview" hidden>Cancel</button></div></div>
  <div class="export-bar"><details class="tray"><summary title="PDF & other options" aria-label="PDF & other options"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h6"/></svg></summary><div class="tray-body"><div class="tray-heading"><strong>PDF & other options</strong><button class="close-tray" aria-label="Close PDF options">×</button></div><div class="control-actions"><button id="download-pdf" disabled>Download PDF</button><button id="download-svg" disabled>Download SVG</button><button id="download-recipe" disabled>Download recipe</button><button id="edit-pdf" disabled>PDF conversion settings ↗</button></div></div></details><span id="plot-hint" class="quiet"></span><div class="studio-actions"><button id="prepare" class="primary" disabled>Prepare plot</button><button id="open-plot" disabled>Open plot ↗</button></div></div>
 </section>
 <section id="ink-drawer" hidden aria-label="Pattern ink assignments"><div class="ink-drawer-heading"><h2>Pattern inks</h2><button id="refresh-carousel">Refresh carousel</button><button id="close-inks" aria-label="Close inks">×</button></div><div class="ink-drawer-body"><div id="palette"></div><p id="inventory-status" class="quiet"></p></div></section>
</main>
<dialog id="gallery"><div class="dialog-heading"><h2>Browse families</h2><button id="close-gallery" aria-label="Close family gallery">×</button></div><p class="gallery-note quiet">Examples use a fixed palette. Choose a family to use your paper and pens.</p><div id="family-groups" role="tablist" aria-label="Pattern groups"></div><div id="family-gallery" class="library-grid" role="tabpanel" tabindex="0"></div></dialog>
<dialog id="library"><div class="dialog-heading"><h2>Open pattern</h2><button id="close-library" aria-label="Close library">×</button></div><label class="library-search">Search<input id="library-search" type="search"></label><div class="control-actions"><button id="import-recipe" type="button">Import recipe…</button><input id="recipe-file" type="file" accept=".json,application/json" hidden></div><p id="recipe-error" role="alert" tabindex="-1" hidden></p><div id="documents" class="library-grid"></div></dialog>
<dialog id="save-dialog"><form id="save-form"><h2 id="save-heading">Save document</h2><label class="field">Name<input id="save-name" maxlength="100" required></label><div class="dialog-actions"><button type="button" id="cancel-save">Cancel</button><button class="primary" type="submit">Save</button></div></form></dialog>
<dialog id="close-dialog"><form method="dialog"><p id="close-message"></p><div class="dialog-actions"><button value="cancel">Cancel</button><button value="discard">Discard</button><button value="save" class="primary">Save</button></div></form></dialog>
</body></html>
