[package]
name = "plotline-studios"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
flate2 = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
axum = { version = "0.8.9", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
# Fixed page registrations must retain their exact f64 values through saved
# JSON and browser/API round trips; the default fast parser can lose one ULP.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
