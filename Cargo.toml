[package]
name = "plotline"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
geos = { version = "11.3.1", features = ["v3_12_0"] }
kurbo = "0.13"
rstar = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["override_allocator_on_supported_platforms"] }
